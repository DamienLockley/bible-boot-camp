<!doctype html>
<!-- Getting to Know Jesus: Maintenance mode marker -->
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#21483e">
  <title>Site Maintenance | Getting to Know Jesus</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(140deg,#eaf3ef,#f9f7ef);color:#183d35;display:grid;place-items:center;padding:22px}
    main{width:min(100%,680px);padding:clamp(28px,6vw,60px);border-radius:22px;background:#fff;box-shadow:0 12px 42px #1e463521;text-align:center}
    .mark{font-size:42px;color:#b97922}.eyebrow{font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#4b7b6e}
    h1{font-size:clamp(2rem,5vw,3rem);line-height:1.14;margin:15px 0}p{font-size:1.12rem;line-height:1.65;color:#405c53}
    .small{font-size:.94rem;color:#58756c;margin-top:28px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <div class="eyebrow">Getting to Know Jesus</div>
    <h1>We’ll be back soon</h1>
    <p>Our Bible studies website is temporarily unavailable while we carry out maintenance and improvements.</p>
    <p>Thank you for your patience. Please visit again shortly.</p>
    <p class="small">God’s blessings to you.</p>
  </main>
</body>
</html>
