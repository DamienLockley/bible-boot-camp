<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#dceffa"><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#17324a;background:#f3f8fd}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:2;background:#dceffa;padding:13px 16px;box-shadow:0 2px 7px #1232;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:850px;margin:auto;padding:15px}.panel{background:white;border:1px solid #dce7ef;border-radius:15px;padding:16px;margin-bottom:13px;box-shadow:0 2px 5px #1231}button,input{font:inherit}button{cursor:pointer;border:1px solid #8cb5d2;border-radius:10px;background:white;color:#17527c;padding:11px;font-weight:650}button.primary,.selected{background:#1672ad;color:white;border-color:#1672ad}button:disabled{opacity:.4}input{width:100%;padding:13px;border:1px solid #adc7d9;border-radius:10px}.bar{display:flex;gap:7px;flex-wrap:wrap}.bar button{flex:1;min-width:110px}.title{font-size:22px;font-weight:750;margin:8px 0}.muted{font-size:13px;color:#647c8d}.item{width:100%;text-align:left;display:flex;justify-content:space-between;gap:10px;margin:6px 0}.hidden{display:none!important}.content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.heading{font-weight:750;color:#145c8e}.bible-ref{cursor:pointer;border:0;background:none;padding:0;font:inherit;display:inline;text-align:left;color:#0869b2;font-weight:750;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}.question{font-weight:700}.answer{background:#eff7fc;padding:12px;border-radius:9px;white-space:pre-wrap}details{margin:10px 0}summary{cursor:pointer;color:#17527c;font-weight:700}.nav{position:sticky;bottom:0;background:#f3f8fdee;padding:12px 0;display:flex;gap:8px}.nav button{flex:1}.versetable{width:100%;border-collapse:collapse}.versetable th,.versetable td{padding:10px;border-bottom:1px solid #dce7ef;text-align:left}.versetable th{background:#eff7fc}#modal{position:fixed;inset:0;background:#000b;z-index:10;overflow:auto;padding:14px}#modal .panel{max-width:900px;margin:auto}#modal img{max-width:100%;height:auto;display:block;margin:15px auto}.imggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.imggrid img{width:100%;height:150px;object-fit:contain;background:#f5f7fa;border-radius:8px}.kjv-verse{padding:7px 0;border-bottom:1px solid #e0ebf2;line-height:1.65}.kjv-verse b{color:#145c8e;margin-right:8px}small{font-size:12px}
</style></head><body><header><div><strong>📖 Bible Boot Camp</strong><div class="muted">Teacher's Guide · Original Word document</div></div><button onclick="home()">Studies</button></header><div class="wrap"><div id="loading" class="panel">Loading study material…</div><div id="library" class="hidden"><div class="panel"><div class="title">Study Library</div><input id="search" placeholder="Search studies and text…" oninput="library()"><div id="list"></div></div></div><div id="study" class="hidden"><div class="panel"><div class="muted" id="counter"></div><div class="title" id="title"></div><div class="bar"><button id="guided" onclick="setMode('guided')">Guided Teaching</button><button id="reference" onclick="setMode('reference')">Scrollable Reference</button><button id="verses" onclick="setMode('verses')">Bible Verses</button><button id="images" onclick="setMode('images')">Images</button></div></div><div id="body"></div><div class="nav"><button onclick="prev()">← Previous</button><button onclick="home()">Studies</button><button class="primary" onclick="next()">Next →</button></div></div></div><div id="verse-modal" class="hidden" style="position:fixed;inset:0;background:#000b;z-index:20;overflow:auto;padding:14px" onclick="if(event.target.id==='verse-modal')closeVerse()"><div class="panel" style="max-width:680px;margin:5vh auto"><button onclick="closeVerse()">Close ✕</button><h3 id="verse-title"></h3><div id="verse-text"></div></div></div><div id="modal" class="hidden" onclick="if(event.target.id==='modal')closeModal()"><div class="panel"><button onclick="closeModal()">Close ✕</button><div id="pic"></div></div></div><script>
let data,section=0,mode='guided',idx=0,kjv=null,kjvStatus='Loading stored KJV verses…';const $=id=>document.getElementById(id),esc=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function library(){const q=$('search').value.toLowerCase().trim();$('list').innerHTML=data.sections.filter(s=>!q||s.title.toLowerCase().includes(q)||s.units.some(u=>u.text.toLowerCase().includes(q))).map(s=>`<button class="item" onclick="openStudy(${s.id})"><span>${s.id+1}. ${esc(s.title)}</span><span>›</span></button>`).join('')||'<p>No matches</p>'}
function home(){$('study').classList.add('hidden');$('library').classList.remove('hidden');library()}
function openStudy(n){section=n;idx=0;mode=localStorage.getItem('bbc-mode')||'guided';$('library').classList.add('hidden');$('study').classList.remove('hidden');$('title').textContent=data.sections[n].title;render()}
function setMode(m){mode=m;localStorage.setItem('bbc-mode',m);render()}
function imageButton(names){return names.length?`<button onclick='showImages(${JSON.stringify(names)})'>▧ Images (${names.length})</button>`:''}
// Colour scripture references without changing the original wording or adding links.
// Operates on HTML-escaped plain text, before it is inserted into the page.
const bibleBook = String.raw`(?:[1-3]\s*)?(?:Genesis|Gen|Exodus|Ex|Leviticus|Lev|Numbers|Num|Deuteronomy|Deut|Joshua|Josh|Judges|Judg|Ruth|Samuel|Sam|Kings|Kgs|Chronicles|Chron|Chr|Ezra|Nehemiah|Neh|Esther|Est|Job|Psalms?|Ps|Proverbs|Prov|Ecclesiastes|Eccl|Song(?:\s+of\s+Solomon)?|Songs?|Isaiah|Isa|Jeremiah|Jer|Lamentations|Lam|Ezekiel|Ezek|Daniel|Dan|Hosea|Hos|Joel|Amos|Obadiah|Obad|Jonah|Micah|Mic|Nahum|Nah|Habakkuk|Hab|Zephaniah|Zeph|Haggai|Hag|Zechariah|Zech|Malachi|Mal|Matthew|Matt|Mat|Mt|Mark|Mk|Luke|Lk|John|Jn|Acts|Romans|Rom|Corinthians|Cor|Galatians|Gal|Ephesians|Eph|Philippians|Phil|Colossians|Col|Thessalonians|Thess|Timothy|Tim|Titus|Philemon|Philem|Hebrews|Heb|James|Jas|Peter|Pet|Jude|Revelation|Rev)`;
const bibleRefRegex = new RegExp(String.raw`\b${bibleBook}\.?\s+\d+(?:\s*[:：]\s*\d+(?:\s*[-–]\s*\d+)?(?:\s*[,;]\s*\d+(?:\s*[-–]\s*\d+)?)*)?(?:\s*[-–]\s*\d+)?`, 'gi');
function highlightRefs(plain){return esc(plain).replace(bibleRefRegex,match=>`<button class="bible-ref" title="Read King James Version" onclick="showVerse(this.textContent)">${match}</button>`)}
const bookNames=['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi','Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation'];
const shortNames=['Gen','Ex','Lev','Num','Deut','Josh','Judg','Ruth','1 Sam','2 Sam','1 Kgs','2 Kgs','1 Chron','2 Chron','Ezra','Neh','Est','Job','Ps','Prov','Eccl','Song','Isa','Jer','Lam','Ezek','Dan','Hos','Joel','Amos','Obad','Jonah','Mic','Nah','Hab','Zeph','Hag','Zech','Mal','Matt','Mark','Luke','John','Acts','Rom','1 Cor','2 Cor','Gal','Eph','Phil','Col','1 Thess','2 Thess','1 Tim','2 Tim','Titus','Philem','Heb','James','1 Pet','2 Pet','1 John','2 John','3 John','Jude','Rev'];
const aliasMap={};bookNames.forEach((n,i)=>{aliasMap[n.toLowerCase().replace(/[^a-z0-9]/g,'')]=n;aliasMap[shortNames[i].toLowerCase().replace(/[^a-z0-9]/g,'')]=n});
Object.assign(aliasMap,{psalm:'Psalms',psalms:'Psalms',ps:'Psalms',mat:'Matthew',mt:'Matthew',mk:'Mark',lk:'Luke',jn:'John',revelations:'Revelation',songofsolomon:'Song of Solomon',songs:'Song of Solomon',samuel:'1 Samuel',kings:'1 Kings',chronicles:'1 Chronicles',corinthians:'1 Corinthians',thessalonians:'1 Thessalonians',timothy:'1 Timothy',peter:'1 Peter',john:'John',acts:'Acts',romans:'Romans',hebrews:'Hebrews',james:'James'});
function resolveBook(name){return aliasMap[name.toLowerCase().replace(/[^a-z0-9]/g,'')]||null}
function showVerse(ref){$('verse-modal').classList.remove('hidden');$('verse-title').textContent=ref+' — KJV';if(!kjv){$('verse-text').textContent=kjvStatus;return}
 const m=ref.trim().match(/^(.+?)\.?\s+(\d+)(?:\s*[:：]\s*(\d+)(?:\s*[-–]\s*(\d+))?)?/);if(!m){$('verse-text').textContent='This reference could not be interpreted.';return}
 const book=resolveBook(m[1]),ch=Number(m[2]),first=m[3]?Number(m[3]):1,last=m[4]?Number(m[4]):first;
 if(!book){$('verse-text').textContent='Book not recognised: '+m[1];return}
 const rows=[];for(let v=first;v<=Math.min(last,first+99);v++){const key=`${book} ${ch}:${v}`;let t=kjv[key];if(!t){if(v===first)rows.push(`<p>Verse not found in stored KJV: ${esc(key)}</p>`);break}rows.push(`<div class="kjv-verse"><b>${v}</b>${esc(String(t).replace(/^#\s*/,''))}</div>`)}
 $('verse-text').innerHTML=rows.join('')||'<p>No verse found.</p>';
}
function closeVerse(){$('verse-modal').classList.add('hidden')}
async function loadKjv(){try{const r=await fetch('kjv-verses.json');if(!r.ok)throw Error('KJV data not yet added');kjv=await r.json();kjvStatus='Ready';if(!$('verse-modal').classList.contains('hidden'))showVerse($('verse-title').textContent.replace(/ — KJV$/,''))}catch(e){kjvStatus='KJV text is not installed in this package yet. Add kjv-verses.json from your Google Drive folder before publishing. '+e.message; if(!$('verse-modal').classList.contains('hidden'))$('verse-text').textContent=kjvStatus}}


function unit(u,hide){let txt=highlightRefs(u.text);let main=u.kind==='answer'&&hide?`<details><summary>Reveal Answer</summary><div class="answer">${txt}</div></details>`:`<div class="content ${u.kind}">${txt}</div>`;return main+(u.images.length?'<div style="margin-top:12px">'+imageButton(u.images)+'</div>':'')}
function render(){const s=data.sections[section];for(const m of ['guided','reference','verses','images'])$(m).classList.toggle('selected',m===mode);$('counter').textContent=`Study ${section+1} of ${data.sections.length}`;let h='';if(mode==='verses'){h=`<div class="panel"><h3>Bible Verses</h3><p class="muted">References identified from this study, in document order. Check against the original Word document for completeness.</p><table class="versetable"><tr><th>#</th><th>Reference</th></tr>${s.verses.map((v,i)=>`<tr><td>${i+1}</td><td>${highlightRefs(v)}</td></tr>`).join('')}</table></div>`}else if(mode==='images'){let imgs=s.units.flatMap(u=>u.images);h=`<div class="panel"><h3>Study Images (${imgs.length})</h3>${imgs.length?'<div class="imggrid">'+imgs.map(n=>`<button onclick='showImages(["${n}"])'>🖼 ${esc(n)}</button>`).join('')+'</div>':'<p>No embedded images in this study.</p>'}</div>`}else if(mode==='guided'){let u=s.units[idx];h=`<div class="panel"><p class="muted">Teaching item ${idx+1} of ${s.units.length}</p>${unit(u,true)}</div>`}else{h=s.units.map((u,i)=>`<div class="panel" id="unit-${i}">${unit(u,false)}</div>`).join('')}$('body').innerHTML=h;localStorage.setItem('bbc-progress',JSON.stringify({section,idx}));if(mode!=='reference')scrollTo(0,0)}
function next(){if(mode==='verses'||mode==='images')return;const s=data.sections[section];idx=Math.min(idx+1,s.units.length-1);if(mode==='guided')render();else document.getElementById('unit-'+idx)?.scrollIntoView({behavior:'smooth'})}
function prev(){if(mode==='verses'||mode==='images')return;idx=Math.max(idx-1,0);if(mode==='guided')render();else document.getElementById('unit-'+idx)?.scrollIntoView({behavior:'smooth'})}
function showImages(names){$('modal').classList.remove('hidden');$('pic').innerHTML=names.map(n=>`<figure><img loading="lazy" src="assets/${encodeURIComponent(n)}" alt="Original document illustration"><figcaption>${esc(n)}</figcaption></figure>`).join('')}
function closeModal(){$('modal').classList.add('hidden')}
loadKjv();fetch('study-data.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{data=d;$('loading').classList.add('hidden');$('library').classList.remove('hidden');home();try{const p=JSON.parse(localStorage.getItem('bbc-progress'));if(p&&p.section<data.sections.length){openStudy(p.section);idx=Math.min(p.idx,data.sections[p.section].units.length-1);render()}}catch(e){}}).catch(e=>$('loading').textContent='Could not load data: '+e.message);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.warn))}
</script></body></html>
