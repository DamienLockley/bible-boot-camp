name: Bible Studies website deployment
run-name: ${{ github.event.head_commit.message || format('Deploy {0}', github.ref_name) }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for GitHub Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)"
            if [[ "$count" =~ ^[0-9]+$ ]] && (( count > 0 )); then
              echo "GitHub Pages artifact is visible to the Actions API."
              exit 0
            fi
            echo "Artifact indexing pending (attempt $attempt/36); checking again in 5 seconds."
            sleep 5
          done
          echo "::error::Uploaded github-pages artifact is not visible to the Actions API after 3 minutes."
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
