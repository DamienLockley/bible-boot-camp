name: Bible Studies website deployment
run-name: ${{ github.event.head_commit.message || format('Deploy {0}', github.ref_name) }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm completed upload is indexed by GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)"
            if [[ "$count" =~ ^[0-9]+$ ]] && (( count > 0 )); then
              echo "Artifact is visible after build job completion."
              # The Pages deployment API has a separate artifact index.
              # Give that index time to catch up before deploy-pages queries it.
              sleep 30
              exit 0
            fi
            echo "Waiting for GitHub Actions artifact indexing ($attempt/36)."
            sleep 5
          done
          echo "::error::Could not verify github-pages artifact indexing."
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
