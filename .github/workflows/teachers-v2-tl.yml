name: Generate Teachers Guide V2 Tagalog
on:
  push:
    paths:
      - 'tools/build_teachers_v2_tagalog.py'
      - '.github/workflows/teachers-v2-tl.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: teachers-v2-tl-generator
  cancel-in-progress: true
jobs:
  build-tl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install translation and Word dependencies
        run: python -m pip install requests beautifulsoup4 python-docx pillow
      - name: Restore translation cache from earlier builds
        uses: actions/cache/restore@v4
        with:
          path: tools/.teacher-tl-cache.json
          key: teachers-v2-tl-cache-${{ github.run_id }}
          restore-keys: |
            teachers-v2-tl-cache-
      - name: Translate all V2 studies and build Tagalog Word master
        run: python tools/build_teachers_v2_tagalog.py
      - name: Save translated texts even if build validation fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/.teacher-tl-cache.json
          key: teachers-v2-tl-cache-${{ github.run_id }}
      - name: Retain recovery cache as downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teachers-tl-translation-checkpoint-${{ github.run_id }}
          path: tools/.teacher-tl-cache.json
          if-no-files-found: warn
          retention-days: 14
      - name: Check language and structural consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('teachers-guide')
          en=json.loads((base/'study-data.json').read_text())['sections']
          tl=json.loads((base/'tl/study-data.json').read_text())['sections']
          assert len(en)==len(tl)==28
          assert sum(len(x['units']) for x in en)==sum(len(x['units']) for x in tl)==2378
          assert all(a['id']==b['id'] and len(a['units'])==len(b['units']) for a,b in zip(en,tl))
          assert (base/'Teachers_Guide_V2_TL_Master.docx').is_file()
          assert '<html lang="tl"' in (base/'tl/index.html').read_text().lower()
          print('Tagalog V2 structural QA passed')
          PY
      - name: Commit complete validated Tagalog release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teachers-guide/tl teachers-guide/Teachers_Guide_V2_TL_Master.docx tools/.teacher-tl-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Build complete Tagalog Teachers Guide V2 from approved English source"
            git push
          fi
