name: Test Teachers Guide V2 Manager Against Full English Master
on:
  push:
    branches:
      - teachers-guide-tl-v2-draft-20261124
    paths:
      - '.github/workflows/test-teacher-manager-full-master.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-master:
    runs-on: ubuntu-latest
    steps:
      - name: Read Bible study source and V2 site
        uses: actions/checkout@v4
      - name: Read Website Manager V25.5 review branch
        uses: actions/checkout@v4
        with:
          repository: DamienLockley/Website-Manager
          ref: teachers-guide-v2-word-manager-20261124
          path: manager
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converter dependencies
        run: python -m pip install python-docx pymupdf Pillow beautifulsoup4
      - name: Download actual V2 English Word master from its successful build
        uses: actions/download-artifact@v4
        with:
          name: Teachers_Guide_V2_EN_Master
          path: /tmp/teacher-master
          run-id: 45353212312
          github-token: ${{ github.token }}
      - name: Convert all 28 studies without regenerating PDFs
        run: |
          mkdir -p /tmp/teacher-site-build
          python manager/Core/Teachers_Guide/Word_Converter/convert_v2.py \
            /tmp/teacher-master/Teachers_Guide_V2_EN_Master.docx \
            --site-template teachers-guide \
            --existing-site teachers-guide \
            --output /tmp/teacher-site-build --pdf-mode keep
      - name: Validate full build parity and preserved design
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          d=Path('/tmp/teacher-site-build/GitHub_PWA')
          old=Path('teachers-guide')
          new=json.loads((d/'study-data.json').read_text())['sections']
          stages=json.loads((d/'teaching-map.json').read_text())['studies']
          enrich=json.loads((d/'main-pathway-enrichments.json').read_text())['studies']
          assert len(new)==len(stages)==len(enrich)==28
          assert sum(len(s['units']) for s in new)>=2378
          assert len(new[10].get('tables',[]))>=2
          assert all(len(s['groups'])>=1 for s in stages)
          assert all(not x['main_stage_additions'] for x in enrich),'Word insights duplicated by JSON'
          assert (d/'index.html').read_bytes()==(old/'index.html').read_bytes(),'Word build overwrote HTML design'
          assert all((d/'study-pdfs'/('Study_%02d.pdf'%i)).is_file() for i in range(1,29))
          print('FULL MASTER BUILD PASS:',len(new),'studies,',
                sum(len(s['units']) for s in new),'items,',
                sum(len(s.get('tables',[])) for s in new),'Word tables')
          PY
