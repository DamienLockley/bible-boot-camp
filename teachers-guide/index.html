/* Active view: readable, strongly highlighted instead of faded. */
.bar button.selected,.bar button.selected:hover,.bar button.selected:focus,.bar button.selected:active{
 background:#08659d!important;color:#ffffff!important;border-color:#064d78!important;

}
.bar button:not(.selected){background:#fff;color:#17527c;opacity:1}
/* Image expanded view fills the viewport but keeps visible, accessible controls. */
#modal.full-image{padding:0;background:#071625;overflow:hidden}
#modal.full-image .panel{width:100%;max-width:none;height:100vh;height:100dvh;margin:0;border-radius:0;background:#071625;color:white;display:flex;flex-direction:column;padding:12px 16px}

</style></head><body><header><div><strong>📖 Bible Studies</strong><div class="muted">Teacher's Guide</div></div><div class="header-actions"><button onclick="home()">Home</button><button class="refresh-button" title="Check for latest version" aria-label="Refresh to latest version" onclick="refreshBibleStudies(this)">↻</button></div></header><div class="wrap"><div id="loading" class="panel">Loading study material…</div><div id="library" class="hidden"><div class="panel"><div class="title">Study Library</div><input id="search" placeholder="Search studies and text…" oninput="library()"><div id="list"></div></div></div><div id="study" class="hidden"><div class="panel"><div class="muted" id="counter"></div><div class="title" id="title"></div><div class="bar" style="margin-bottom:11px"><button class="primary" onclick="shareStudyPdf()">↗ Share Study PDF</button></div><div class="bar"><button id="guided" onclick="setMode('guided')">Guided Teaching</button><button id="reference" onclick="setMode('reference')">Scrollable Reference</button><button id="verses" onclick="setMode('verses')">Bible Verses</button></div></div><div id="body"></div></div></div><div id="verse-modal" class="hidden" style="position:fixed;inset:0;background:#000b;z-index:20;overflow:auto;padding:14px" onclick="if(event.target.id==='verse-modal')closeVerse()"><div class="panel" style="max-width:680px;margin:5vh auto"><button onclick="closeVerse()">Close ✕</button><h3 id="verse-title"></h3><div id="verse-text"></div></div></div><div id="modal" class="hidden" onclick="if(event.target.id==='modal')closeModal()"><div class="panel"><div class="image-toolbar"><button onclick="closeModal()">Close ✕</button><button id="image-fullscreen" onclick="toggleImageFullscreen()">⛶ Full Screen</button></div><div id="pic"></div><div id="image-controls" class="image-controls hidden"><button id="image-prev" onclick="stepImage(-1)">← Previous</button><span id="image-count" class="muted"></span><button id="image-next" onclick="stepImage(1)">Next →</button></div></div></div><script>
let data,section=0,mode='guided',idx=0,kjv=null,kjvStatus='Loading stored KJV verses…';const $=id=>document.getElementById(id),esc=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// PDFs are built from the original PDF, not from the simplified app text.
const pdfBase = './study-pdfs/';
function studyPdfUrl(){return pdfBase+'Study_'+String(section+1).padStart(2,'0')+'.pdf'}

// Share a direct link to the PDF for the CURRENT study. Never open or download it here.
async function shareStudyPdf(){
  if(!data || !Array.isArray(data.sections) || !data.sections[section]){
    alert('Please open a study before sharing.');
    return;
  }
  const study = data.sections[section];
  const pdfUrl = new URL(studyPdfUrl(), document.baseURI).href;
  const payload = {title: 'Bible Studies — ' + study.title,
                   text: 'Bible study: ' + study.title,
                   url: pdfUrl};
  try {
    if(navigator.share){
      await navigator.share(payload);
      return;
    }
  } catch(err) {
    if(err && err.name === 'AbortError') return; // User closed share sheet.
    // Other sharing failures fall back to copying or displaying the link.
  }
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(pdfUrl);
      alert('Study PDF link copied. You can paste it into a message or email.');
      return;
    }
  } catch(err) { /* A blocked clipboard still gets a usable link below. */ }
  window.prompt('Copy this link to share the current study PDF:', pdfUrl);
}


function library(){const q=$('search').value.toLowerCase().trim();$('list').innerHTML=data.sections.filter(s=>!q||s.title.toLowerCase().includes(q)||s.units.some(u=>u.text.toLowerCase().includes(q))).map(s=>`<button class="item" onclick="openStudy(${s.id})"><span>${s.id+1}. ${esc(s.title)}</span><span>›</span></button>`).join('')||'<p>No matches</p>'}
function home(){$('study').classList.add('hidden');$('library').classList.remove('hidden');library()}
function openStudy(n){section=n;idx=0;mode=['guided','reference','verses'].includes(localStorage.getItem('bbc-mode'))?localStorage.getItem('bbc-mode'):'guided';$('library').classList.add('hidden');$('study').classList.remove('hidden');$('title').textContent=data.sections[n].title;render()}
function setMode(m){mode=m;idx=0;localStorage.setItem('bbc-mode',m);render()}
function imageButton(names){return names.length?`<button onclick='showImages(${JSON.stringify(names)})'>▧ Image</button>`:''}
// Colour scripture references without changing the original wording or adding links.
// Operates on HTML-escaped plain text, before it is inserted into the page.
const bibleBook = String.raw`(?:[1-3]\s*)?(?:Genesis|Gen|Exodus|Ex|Leviticus|Lev|Numbers|Num|Deuteronomy|Deut|Joshua|Josh|Judges|Judg|Ruth|Samuel|Sam|Kings|Kgs|Chronicles|Chron|Chr|Ezra|Nehemiah|Neh|Esther|Est|Job|Psalms?|Ps|Proverbs|Prov|Ecclesiastes|Eccl|Song(?:\s+of\s+Solomon)?|Songs?|Isaiah|Isa|Jeremiah|Jer|Lamentations|Lam|Ezekiel|Ezek|Daniel|Dan|Hosea|Hos|Joel|Amos|Obadiah|Obad|Jonah|Micah|Mic|Nahum|Nah|Habakkuk|Hab|Zephaniah|Zeph|Haggai|Hag|Zechariah|Zech|Malachi|Mal|Matthew|Matt|Mat|Mt|Mark|Mk|Luke|Lk|John|Jn|Acts|Romans|Rom|Corinthians|Cor|Galatians|Gal|Ephesians|Eph|Philippians|Phil|Colossians|Col|Thessalonians|Thess|Timothy|Tim|Titus|Philemon|Philem|Hebrews|Heb|James|Jas|Peter|Pet|Jude|Revelation|Rev)`;
const bibleRefRegex = new RegExp(String.raw`\b${bibleBook}\.?\s+\d+(?:\s*[:：]\s*\d+(?:\s*[-–]\s*\d+)?(?:\s*[,;]\s*\d+(?:\s*[:：]\s*\d+)?(?:\s*[-–]\s*\d+)?)*)?(?:\s*[-–]\s*\d+)?`, 'gi');
function highlightRefs(plain){return esc(plain).replace(bibleRefRegex,match=>`<button class="bible-ref" title="Read King James Version" onclick="showVerse(this.textContent)">${match}</button>`)}
const bookNames=['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi','Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation'];
const shortNames=['Gen','Ex','Lev','Num','Deut','Josh','Judg','Ruth','1 Sam','2 Sam','1 Kgs','2 Kgs','1 Chron','2 Chron','Ezra','Neh','Est','Job','Ps','Prov','Eccl','Song','Isa','Jer','Lam','Ezek','Dan','Hos','Joel','Amos','Obad','Jonah','Mic','Nah','Hab','Zeph','Hag','Zech','Mal','Matt','Mark','Luke','John','Acts','Rom','1 Cor','2 Cor','Gal','Eph','Phil','Col','1 Thess','2 Thess','1 Tim','2 Tim','Titus','Philem','Heb','James','1 Pet','2 Pet','1 John','2 John','3 John','Jude','Rev'];
const aliasMap={};bookNames.forEach((n,i)=>{aliasMap[n.toLowerCase().replace(/[^a-z0-9]/g,'')]=n;aliasMap[shortNames[i].toLowerCase().replace(/[^a-z0-9]/g,'')]=n});
Object.assign(aliasMap,{psalm:'Psalms',psalms:'Psalms',ps:'Psalms',mat:'Matthew',mt:'Matthew',mk:'Mark',lk:'Luke',jn:'John',revelations:'Revelation',songofsolomon:'Song of Solomon',songs:'Song of Solomon',samuel:'1 Samuel',kings:'1 Kings',chronicles:'1 Chronicles',corinthians:'1 Corinthians',thessalonians:'1 Thessalonians',timothy:'1 Timothy',peter:'1 Peter',john:'John',acts:'Acts',romans:'Romans',hebrews:'Hebrews',james:'James'});
function resolveBook(name){return aliasMap[name.toLowerCase().replace(/[^a-z0-9]/g,'')]||null}
// Parse comma-separated verses and semicolon-separated chapter changes.
// E.g. John 3:16,19; 4:20 => 3:16, 3:19, 4:20.
function expandReferences(ref){
 const m=ref.trim().match(/^(.+?)\.?\s+(\d+)\s*[:：]\s*(.+)$/);
 if(!m)return [];
 const book=resolveBook(m[1]);if(!book)return [];
 let chapter=Number(m[2]), verses=[], limit=0;
 for(const segment of m[3].split(/\s*;\s*/)){
   if(!segment.trim())continue;
   const items=segment.split(/\s*,\s*/);
   for(let j=0;j<items.length;j++){
     const token=items[j].trim();
     const chapterToken=token.match(/^(\d+)\s*[:：]\s*(\d+)(?:\s*[-–]\s*(\d+))?$/);
     const verseToken=token.match(/^(\d+)(?:\s*[-–]\s*(\d+))?$/);
     if(chapterToken){chapter=Number(chapterToken[1]);}
     if(!chapterToken&&!verseToken)continue;
     const first=Number(chapterToken?chapterToken[2]:verseToken[1]);
     const last=Number((chapterToken?chapterToken[3]:verseToken[2])||first);
     if(first<1||last<first||last-first>150)continue;
     for(let v=first;v<=last&&limit<300;v++,limit++)verses.push(`${book} ${chapter}:${v}`);
   }
 }
 return [...new Set(verses)];
}
function showVerse(ref){
 $('verse-modal').classList.remove('hidden');$('verse-title').textContent=ref+' — KJV';
 if(!kjv){$('verse-text').textContent=kjvStatus;loadKjvOnce();return}
 const refs=expandReferences(ref);
 if(!refs.length){$('verse-text').textContent='This reference could not be interpreted.';return}
 $('verse-text').innerHTML=refs.map(key=>kjv[key]
 ?`<div class="kjv-verse"><b>${esc(key)}</b> ${esc(String(kjv[key]).replace(/^#\s*/,''))}</div>`
 :`<p>Verse not found in stored KJV: ${esc(key)}</p>`).join('');
}
function closeVerse(){$('verse-modal').classList.add('hidden')}
let kjvPromise=null;
function loadKjvOnce(){if(!kjvPromise)kjvPromise=loadKjv();return kjvPromise;}
async function loadKjv(){try{const r=await fetch('kjv-verses.json');if(!r.ok)throw Error('KJV data not yet added');kjv=await r.json();kjvStatus='Ready';if(!$('verse-modal').classList.contains('hidden'))showVerse($('verse-title').textContent.replace(/ — KJV$/,''))}catch(e){kjvStatus='KJV text is not installed in this package yet. Add kjv-verses.json from your Google Drive folder before publishing. '+e.message; if(!$('verse-modal').classList.contains('hidden'))$('verse-text').textContent=kjvStatus}}


function imageGroup(units,start){const names=[];let i=start;
 while(i<units.length){const u=units[i];if((u.text||'').trim()||!u.images||!u.images.length)break;names.push(...u.images);i++}
 return {names,next:i};
}
function unitsWithImageGroups(units,hide){let html='';for(let i=0;i<units.length;){
 const u=units[i], names=[...(u.images||[])];let next=i+1;
 // Subsequent image-only units belong to the same image gallery.
 if(names.length)while(next<units.length&&!(units[next].text||'').trim()&&units[next].images.length){names.push(...units[next].images);next++}
 const main=unit({...u,images:[]},hide);
 html+=`<div class="panel" id="unit-${i}">${main}${names.length?`<div style="margin-top:12px">${imageButton(names)}</div>`:''}</div>`;
 i=next;
 }return html;
}
function unit(u,hide){let txt=highlightRefs(u.text);let main=u.kind==='answer'&&hide?`<details><summary>Reveal Answer</summary><div class="answer">${txt}</div></details>`:`<div class="content ${u.kind}">${txt}</div>`;return main+(u.images.length?'<div style="margin-top:12px">'+imageButton(u.images)+'</div>':'')}
function render(){const s=data.sections[section];for(const m of ['guided','reference','verses'])$(m).classList.toggle('selected',m===mode);$('counter').textContent=`Study ${section+1} of ${data.sections.length}`;let h='';if(mode==='verses'){h=`<div class="panel"><h3>Bible Verses</h3><p class="muted">References identified from this study, in document order.</p><table class="versetable"><tr><th>#</th><th>Reference</th></tr>${s.verses.map((v,i)=>`<tr><td>${i+1}</td><td>${highlightRefs(v)}</td></tr>`).join('')}</table></div>`}else if(mode==='guided'){let u=s.units[idx];let i=idx;while(i>0&&s.units[i-1].images.length&&!(s.units[i-1].text||'').trim()&&!(s.units[i].text||'').trim())i--;const group=imageGroup(s.units,i);if(group.names.length&&idx<group.next){h=`<div class="panel"><p class="muted">Teaching item ${i+1} of ${s.units.length}</p>${imageButton(group.names)}</div>`}else{h=`<div class="panel"><p class="muted">Teaching item ${idx+1} of ${s.units.length}</p>${unit(u,true)}</div>`}}else{h=unitsWithImageGroups(s.units,false)}if(mode==='guided')h+=`<div class="panel"><div class="bar"><button onclick="guidedStep(-1)" ${idx===0?'disabled':''}>← Back</button><button class="primary" onclick="guidedStep(1)" ${idx>=s.units.length-1?'disabled':''}>Continue →</button></div></div>`;$('body').innerHTML=h;localStorage.setItem('bbc-progress',JSON.stringify({section,idx}));if(mode!=='reference')scrollTo(0,0)}
function guidedStep(delta){idx=Math.max(0,Math.min(data.sections[section].units.length-1,idx+delta));if(delta>0){const g=imageGroup(data.sections[section].units,idx);if(g.names.length&&idx>0&&imageGroup(data.sections[section].units,idx-1).next>idx)idx=g.next-1;}render()}
function next(){if(mode!=='reference')return;const s=data.sections[section];idx=Math.min(idx+1,s.units.length-1);document.getElementById('unit-'+idx)?.scrollIntoView({behavior:'smooth'})}
function prev(){if(mode!=='reference')return;idx=Math.max(idx-1,0);document.getElementById('unit-'+idx)?.scrollIntoView({behavior:'smooth'})}
let imageNames=[],imageIndex=0,imageSerial=0;
function showImages(names){imageNames=names;imageIndex=0;$('modal').classList.remove('hidden');document.body.classList.add('image-open');renderImage()}
function stepImage(delta){imageIndex=Math.max(0,Math.min(imageNames.length-1,imageIndex+delta));renderImage()}
function renderImage(){const n=imageNames[imageIndex],serial=++imageSerial;
 $('image-controls').classList.toggle('hidden',imageNames.length<2);
 $('image-count').textContent=`${imageIndex+1} of ${imageNames.length}`;
 $('image-prev').disabled=imageIndex===0;$('image-next').disabled=imageIndex===imageNames.length-1;
 $('pic').textContent='Loading image…';
 loadImage(n,src=>{if(serial!==imageSerial)return;$('pic').innerHTML=src?`<img src="${src}" alt="Study illustration">`:'<p>Image unavailable.</p>'})
}
function loadImage(n,callback){callback('assets/'+encodeURIComponent(n))}
function toggleImageFullscreen(){
 const active=$('modal').classList.toggle('full-image');
 $('image-fullscreen').textContent=active?'⤢ Exit Full Screen':'⛶ Full Screen';
}
function closeModal(){imageSerial++;$('modal').classList.add('hidden');$('modal').classList.remove('full-image');document.body.classList.remove('image-open');$('image-fullscreen').textContent='⛶ Full Screen'}
window.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('modal').classList.contains('hidden'))closeModal();
 else if(!$('modal').classList.contains('hidden')&&e.key==='ArrowLeft')stepImage(-1);
 else if(!$('modal').classList.contains('hidden')&&e.key==='ArrowRight')stepImage(1);
});
fetch('study-data.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{data=d;$('loading').classList.add('hidden');$('library').classList.remove('hidden');home();try{const p=JSON.parse(localStorage.getItem('bbc-progress'));if(p&&p.section<data.sections.length){openStudy(p.section);idx=Math.min(p.idx,data.sections[p.section].units.length-1);render()}}catch(e){}}).catch(e=>$('loading').textContent='Could not load data: '+e.message);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.warn))}

// Check online content first; the service worker uses network-first for app files.
async function refreshBibleStudies(button){
 if(button.disabled)return;
 button.disabled=true;button.classList.add('refreshing');button.textContent='…';
 try{
   const response=await fetch('./study-data.json?refresh='+Date.now(),{cache:'no-store'});
   if(!response.ok)throw Error('Website returned HTTP '+response.status);
   const updated=await response.json();
   if(!updated||!Array.isArray(updated.sections))throw Error('Invalid study file');
   if('serviceWorker' in navigator){
     const registration=await navigator.serviceWorker.getRegistration();
     if(registration)await registration.update();
   }
   location.reload();
 }catch(error){
   alert('Unable to reach the latest study files. Your offline studies are still available.\n\n'+error.message);
   button.disabled=false;button.classList.remove('refreshing');button.textContent='↻';
 }
}

</script></body></html>
